spring:
  application:
    name: product-service
  config:
    import: configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
    openfeign:
      oauth2:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          category-service:
            authorizationGrantType: client_credentials
            clientId: product-service
            clientSecret: 123456
            scope: read
            provider: micro-ecom
          brand-service:
            authorizationGrantType: client_credentials
            clientId: product-service
            clientSecret: 123456
            scope: read
            provider: micro-ecom
        provider:
          micro-ecom:
            issuer-uri: http://localhost:9000
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB